name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CHRISTINA_GITHUB_OWNER: ${{ github.repository_owner }}
      CHRISTINA_GITHUB_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate desktop
        run: |
          bun run --cwd apps/desktop generate:routes
          bun run --cwd apps/desktop typecheck
      - name: Build one-click Windows installer
        run: bun run --cwd apps/desktop build -- --win nsis --x64 --publish never
      - name: Generate checksums
        shell: pwsh
        run: |
          if (Test-Path apps/desktop/release/SHA256SUMS.txt) {
            Remove-Item apps/desktop/release/SHA256SUMS.txt -Force
          }
          Get-ChildItem apps/desktop/release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii apps/desktop/release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v7
        with:
          name: CHRISTINA-Windows-Installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" apps/desktop/release/*.exe apps/desktop/release/*.yml apps/desktop/release/SHA256SUMS.txt --clobber

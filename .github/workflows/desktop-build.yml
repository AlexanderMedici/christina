name: Unsigned Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/agent-kernel/**"
      - "packages/shared/**"
      - "packages/local-db/**"
      - "bun.lock"

permissions:
  contents: read

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CHRISTINA_GITHUB_OWNER: YOUR_GITHUB_USERNAME
      CHRISTINA_GITHUB_REPO: christina
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile desktop
        run: bun run --cwd apps/desktop compile:app
      - name: Package unsigned desktop
        run: bun run --cwd apps/desktop package -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: christina-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 14

name: Source Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archives
        run: |
          git archive --format=zip --prefix=christina-${GITHUB_REF_NAME}/ --output=christina-${GITHUB_REF_NAME}-source.zip HEAD
          git archive --format=tar.gz --prefix=christina-${GITHUB_REF_NAME}/ --output=christina-${GITHUB_REF_NAME}-source.tar.gz HEAD
          sha256sum christina-${GITHUB_REF_NAME}-source.* > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             christina-${GITHUB_REF_NAME}-source.zip             christina-${GITHUB_REF_NAME}-source.tar.gz             SHA256SUMS.txt             --generate-notes             --title "CHRISTINA ${GITHUB_REF_NAME}"
